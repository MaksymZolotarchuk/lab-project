<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Listing</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Users Listing</h1>
            <nav>
                <a href="logout.html" class="link">Logout</a>
            </nav>
        </header>
        <main>
            <section class="user-list">
                <h2>Users</h2>
                <ul>
                    <!-- Example user items -->
                    <li class="user-item">
                        <span class="username">admin_user</span> - <span class="role">Admin</span>
                        <button class="button" onclick="viewUser('admin_user')">View</button>
                        <button class="button" onclick="editUser('admin_user')">Edit</button>
                        <button class="button" onclick="deleteUser('admin_user')">Delete</button>
                    </li>
                    <li class="user-item">
                        <span class="username">regular_user</span> - <span class="role">Regular</span>
                        <button class="button" onclick="viewUser('regular_user')">View</button>
                        <button class="button" onclick="editUser('regular_user')">Edit</button>
                        <button class="button" onclick="deleteUser('regular_user')">Delete</button>
                    </li>
                </ul>
                <button class="button" onclick="openCreateUserDialog()">Create User</button>
            </section>
        </main>
    </div>

    <!-- Create User Dialog -->
    <dialog id="createUserDialog">
        <form method="dialog">
            <h2>Create User</h2>
            <div class="form-group">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" name="newUsername" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="admin">Admin</option>
                    <option value="regular">Regular</option>
                </select>
            </div>
            <button type="submit" class="button">OK</button>
            <button type="reset" class="button">Cancel</button>
        </form>
    </dialog>

    <script>
        function openCreateUserDialog() {
            document.getElementById('createUserDialog').showModal();
        }

        function viewUser(username) {
            window.location.href = `user_info.html?username=${username}`;
        }

        function editUser(username) {
            window.location.href = `edit_user.html?username=${username}`;
        }

        function deleteUser(username) {
            if (confirm(`Are you sure you want to delete ${username}?`)) {
                // Add delete logic here
                alert(`${username} deleted successfully.`);
            }
        }
    </script>
</body>
</html>
