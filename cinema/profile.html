<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Profile</h1>
            <nav>
                <a href="users.html" class="link">Back to Users</a>
                <a href="logout.html" class="link">Logout</a>
            </nav>
        </header>
        <main>
            <section class="profile card">
                <h2>Your Profile</h2>
                <p><strong>Username:</strong> <span id="profileUsername"></span></p>
                <p><strong>Role:</strong> <span id="profileRole"></span></p>
                <!-- Add more profile information fields as needed -->
            </section>
        </main>
    </div>

    <script>
        // Simulate fetching user profile data
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        if (username) {
            document.getElementById('profileUsername').textContent = username;
            // Simulate setting user role
            document.getElementById('profileRole').textContent = username === 'admin_user' ? 'Admin' : 'Regular';
        }
    </script>
</body>
</html>
