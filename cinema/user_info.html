<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Information</h1>
            <nav>
                <a href="users.html" class="link">Back to Users</a>
                <a href="logout.html" class="link">Logout</a>
            </nav>
        </header>
        <main>
            <section class="user-info card">
                <h2 id="userUsername">User Information</h2>
                <p><strong>Role:</strong> <span id="userRole"></span></p>
                <!-- Add more user information fields as needed -->
            </section>
        </main>
    </div>

    <script>
        // Simulate fetching user data
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        if (username) {
            document.getElementById('userUsername').textContent = username;
            // Simulate setting user role
            document.getElementById('userRole').textContent = username === 'admin_user' ? 'Admin' : 'Regular';
        }
    </script>
</body>
</html>
