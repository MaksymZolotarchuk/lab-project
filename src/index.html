<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="section" id="loginSection">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p class="error" id="loginError"></p>
        </div>

        <div class="section" id="filmsSection" style="display: none;">
            <h2>Films</h2>
            <div id="filmsList"></div>
            <div id="filmForm" style="display: none;">
                <h3>Add Film</h3>
                <input type="text" id="filmTitle" placeholder="Title">
                <input type="number" id="filmDuration" placeholder="Duration (minutes)">
                <textarea id="filmDescription" placeholder="Description"></textarea>
                <button onclick="addFilm()">Add Film</button>
            </div>
        </div>

        <div class="section" id="hallsSection" style="display: none;">
            <h2>Halls</h2>
            <div id="hallsList"></div>
            <div id="hallForm" style="display: none;">
                <h3>Add Hall</h3>
                <input type="text" id="hallName" placeholder="Hall Name">
                <button onclick="addHall()">Add Hall</button>
            </div>
        </div>

        <div class="section" id="schedulesSection" style="display: none;">
            <h2>Schedules</h2>
            <div id="schedulesList"></div>
            <div id="scheduleForm" style="display: none;">
                <h3>Add Schedule</h3>
                <select id="scheduleFilm"></select>
                <select id="scheduleHall"></select>
                <input type="datetime-local" id="scheduleTime">
                <button onclick="addSchedule()">Add Schedule</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
